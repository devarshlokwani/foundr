<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings | Foundr</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("foundr-theme");
        if (t && t !== "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./shared/css/tokens.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); }
  </style>
</head>
<body>
  <foundr-settings></foundr-settings>
  <script type="module" src="./features/settings/settings.entry.ts"></script>
</body>
</html>
